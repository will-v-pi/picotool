name: Hardware Tests (RP2040 + RP2350)

# Runs the pytest suite in test/ against real boards on a self-hosted runner
# (see test/README.md and test/DEBUG_PROBES.md-style setup: a Pico + Pico 2,
# each wired both to native USB and to a debug probe).
#
# Deliberately never passes --run-otp: OTP is one-way, and this workflow is
# meant to run against real silicon, not an FPGA. The OTP *device* tests
# (test_otp_device.py, test_otp_secure_boot.py) stay skipped by the suite's
# own default gating - see test/README.md's "OTP tests" section - so nothing
# here needs to (or should) special-case them further.
on:
  push:
    paths-ignore:
      - '**.md'
  pull_request:
    paths-ignore:
      - '**.md'
  workflow_dispatch:

jobs:
  hardware-tests:
    name: Hardware tests
    runs-on: [self-hosted, linux, arm64, trixie, pico, pico2]
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout picotool
        uses: actions/checkout@v7

      - name: Check prerequisites
        # Bounded so an apt lock / network stall can't hang the job until the
        # 6-hour default - there's no longer a job-level timeout catching this.
        timeout-minutes: 15
        run: |
          sudo apt install -y cmake ninja-build python3 build-essential gcc-arm-none-eabi libnewlib-arm-none-eabi libstdc++-arm-none-eabi-newlib
          sudo apt install -y pkg-config libusb-1.0-0-dev
          sudo apt install -y openocd git
          # Give the runner access to the RP boards + debug probes over USB.
          # The distro's 60-picotool.rules grants access via TAG+="uaccess"
          # (active login seat only - a background CI runner has no seat) and
          # MODE=660 GROUP=plugdev (needs the runner's service user in plugdev),
          # so neither path works here. Drop a permissive, vendor-wide rule
          # (covers app + BOOTSEL PIDs, which change on reboot, and the
          # CMSIS-DAP probe) that doesn't depend on seat or group membership.
          # Fine for a dedicated, physically-secured test runner.
          echo 'SUBSYSTEM=="usb", ATTRS{idVendor}=="2e8a", MODE:="0666"' \
            | sudo tee /etc/udev/rules.d/99-picotool-ci.rules
          sudo udevadm control --reload
          sudo udevadm trigger

      - name: Checkout Pico SDK (develop)
        uses: actions/checkout@v7
        with:
          repository: raspberrypi/pico-sdk
          ref: develop
          path: pico-sdk

      - name: Checkout Pico Examples (develop)
        uses: actions/checkout@v7
        with:
          repository: raspberrypi/pico-examples
          ref: develop
          path: pico-examples

      - name: Fetch required pico-sdk submodules
        # tinyusb: needed for pico_stdio_usb (hello_usb/serial/reset/anything).
        # mbedtls: needed for picotool itself - without it, CMake sets
        #   HAS_MBEDTLS=0 and the whole `seal` command (signing/hashing, used
        #   by test_seal_secure_boot.py, test_otp_secure_boot.py and the
        #   pre-existing test_seal_squash.py) is compiled out entirely, which
        #   fails those tests with "unknown command: seal" - not a test bug.
        # Not the full recursive set (cyw43-driver/lwip/btstack), which is
        # much heavier and unused by anything this workflow builds.
        working-directory: pico-sdk
        run: git submodule update --init --depth 1 lib/tinyusb lib/mbedtls

      - name: Build picotool
        # Always install (never just build in-place): PICOTOOL_FLAT_INSTALL +
        # CMAKE_INSTALL_PREFIX is BUILDING.md's documented custom-path install
        # (see "Custom Path Installation"), and gives every downstream step -
        # the test suite, build_binaries.sh's picotool_DIR reuse, cleanup - one
        # consistent installed binary to point at instead of a raw build tree.
        # (~3 min in practice; bounded since there's no job-level timeout.)
        timeout-minutes: 15
        run: |
          cmake -S . -B build -G Ninja \
            -D PICO_SDK_PATH="${{ github.workspace }}/pico-sdk" \
            -D PICOTOOL_FLAT_INSTALL=1 \
            -D CMAKE_INSTALL_PREFIX="${{ github.workspace }}/install"
          cmake --build build
          cmake --install build

      - name: Build test firmware binaries
        working-directory: test
        # ~3 min in practice; bounded since there's no job-level timeout.
        timeout-minutes: 20
        env:
          PICO_SDK_PATH: ${{ github.workspace }}/pico-sdk
          PICO_EXAMPLES_PATH: ${{ github.workspace }}/pico-examples
        run: ./build_binaries.sh

      - name: Fetch MicroPython / CircuitPython firmware
        working-directory: test
        # Best-effort: test_bdev_firmware.py skips cleanly if these are absent,
        # so a flaky download here shouldn't fail the whole run. Timed out
        # rather than left to hang, since continue-on-error doesn't cover a
        # stalled download and there's no job-level timeout.
        continue-on-error: true
        timeout-minutes: 10
        run: ./fetch_firmware.sh

      - name: Set up Python test environment
        working-directory: test
        # Bounded so a hung pip / PyPI stall can't run to the 6-hour default.
        timeout-minutes: 10
        run: |
          python3 -m venv test-venv
          ./test-venv/bin/pip install --upgrade pip
          ./test-venv/bin/pip install -r requirements.txt

      - name: Run hardware test suite
        working-directory: test
        # Capped so a hang in the tests can't run indefinitely and starve the
        # "Restore boards" step below - that step is the one thing standing
        # between a wedged run and the runner being reset with a board stuck
        # in BOOTSEL.
        timeout-minutes: 20
        env:
          # Passed via env rather than --picotool: a CLI option whose value
          # resolves to a real path outside test/ confuses pytest's rootdir/
          # conftest auto-detection (it gets treated as an extra collection
          # arg before conftest.py - and its --picotool addoption - has been
          # loaded), so "--picotool ../build/picotool" fails with
          # "unrecognized arguments: --picotool" even though --picotool is a
          # valid, registered option. conftest.py already falls back to this
          # env var, so just don't pass the flag at all.
          PICOTOOL: ${{ github.workspace }}/install/picotool/picotool
        run: |
          ./test-venv/bin/python -m pytest -v --tb=short \
            --boards rp2040,rp2350 \
            --require-boards

      - name: Restore boards to a known-good app
        # Always runs, even on failure/timeout above, so a test that left a
        # board on a partition table or in BOOTSEL doesn't affect the next
        # run. Deliberately NOT continue-on-error: this runner misbehaves on
        # its next reset if a board is left in BOOTSEL, so a board that's
        # still stuck after ci_restore_boards.py's own retries should fail
        # the job loudly rather than pass silently.
        if: always()
        working-directory: test
        timeout-minutes: 5
        run: ./test-venv/bin/python ci_restore_boards.py ${{ github.workspace }}/install/picotool/picotool rp2040 rp2350
