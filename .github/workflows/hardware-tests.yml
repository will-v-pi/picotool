name: Hardware Tests (RP2040 + RP2350)

# Runs the pytest suite in test/ against real boards on a self-hosted runner
# (see test/README.md and test/DEBUG_PROBES.md-style setup: a Pico + Pico 2,
# each wired both to native USB and to a debug probe).
#
# On push/PR (and a plain manual run) this only exercises the default
# rp2040+rp2350 hardware suite, and deliberately never passes --run-otp: OTP
# is one-way, and that suite runs against real silicon, not an FPGA. The OTP
# *device* tests (test_otp_device.py, test_otp_secure_boot.py) stay skipped
# by the suite's own default gating - see test/README.md's "OTP tests"
# section - so nothing here needs to (or should) special-case them further.
#
# The OTP suite instead runs as an opt-in second variant below, gated behind
# the run_otp_fpga workflow_dispatch checkbox, against a dedicated `fpga`
# runner rather than the real pico/pico2 boards - since --run-otp burns
# one-way OTP fuses, it must never run against real silicon in CI.
#
# select-suite picks which variant's matrix entry to run: jobs.<id>.if can't
# see the matrix context (only runs-on/steps/env can), so the choice has to
# be made before the matrix is expanded, in a separate job.
on:
  push:
    paths-ignore:
      - '**.md'
  pull_request:
    paths-ignore:
      - '**.md'
  workflow_dispatch:
    inputs:
      run_otp_fpga:
        description: >-
          Run the OTP suite (--boards rp2350 --run-otp) against the fpga
          runner instead of the usual rp2040+rp2350 hardware suite. OTP
          fuses are one-way, so this must stay off real silicon.
        type: boolean
        default: false

jobs:
  select-suite:
    name: Select test suite
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
    steps:
      - id: select
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.run_otp_fpga }}" == "true" ]]; then
            SUITE='{"suite":"rp2350-otp-fpga","run_otp_fpga":true,"runner_tags":["self-hosted","linux","arm64","fpga"],"pytest_args":"--boards rp2350 --run-otp --only-otp","restore_boards_args":"rp2350","run_timeout":60}'
          else
            SUITE='{"suite":"rp2040-rp2350","run_otp_fpga":false,"runner_tags":["self-hosted","linux","arm64","pico","pico2"],"pytest_args":"--boards rp2040,rp2350","restore_boards_args":"rp2040 rp2350","run_timeout":30}'
          fi
          echo "matrix={\"include\":[$SUITE]}" >> "$GITHUB_OUTPUT"

  hardware-tests:
    needs: select-suite
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.select-suite.outputs.matrix) }}
    name: Hardware tests (${{ matrix.suite }})
    runs-on: ${{ matrix.runner_tags }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Check for devices
        # check for RPi VID, to double check at least one device is attached
        timeout-minutes: 2
        run: |
          for i in $(seq 1 30); do
            n=$(lsusb -d 2e8a: | wc -l)
            echo "attempt $i: $n Raspberry Pi USB device(s) present"
            [ "$n" -ge 1 ] && break
            sleep 2
          done
          if [ "$(lsusb -d 2e8a: | wc -l)" -lt 1 ]; then
            echo "::error :: no Raspberry Pi (VID 2e8a) USB device found"
            exit 1
          fi
          echo "Raspberry Pi USB device(s) present; waiting 10s before starting test"
          sleep 10
          lsusb -d 2e8a:

      - name: Checkout picotool
        uses: actions/checkout@v7

      - name: Check prerequisites
        # Bounded so an apt lock / network stall can't hang the job until the
        # 6-hour default - there's no longer a job-level timeout catching this.
        timeout-minutes: 10
        run: |
          sudo apt install -y cmake ninja-build python3 build-essential gcc-arm-none-eabi libnewlib-arm-none-eabi libstdc++-arm-none-eabi-newlib
          sudo apt install -y pkg-config libusb-1.0-0-dev
          sudo apt install -y openocd git
          # Give the runner access to the RP boards + debug probes over USB.
          # The distro's 60-picotool.rules grants access via TAG+="uaccess"
          # (active login seat only - a background CI runner has no seat) and
          # MODE=660 GROUP=plugdev (needs the runner's service user in plugdev),
          # so neither path works here. Drop a permissive, vendor-wide rule
          # (covers app + BOOTSEL PIDs, which change on reboot, and the
          # CMSIS-DAP probe) that doesn't depend on seat or group membership.
          # Fine for a dedicated, physically-secured test runner. The 0xcafe
          # rule covers dev_multi_cdc's custom vid so test_selectors.py can
          # drive it by --vid/--pid; without it that device is root-only.
          echo 'SUBSYSTEM=="usb", ATTRS{idVendor}=="2e8a", MODE:="0666"' | sudo tee /etc/udev/rules.d/99-picotool-ci.rules
          echo 'SUBSYSTEM=="usb", ATTRS{idVendor}=="cafe", MODE:="0666"' | sudo tee -a /etc/udev/rules.d/99-picotool-ci.rules
          sudo udevadm control --reload
          sudo udevadm trigger

      - name: Checkout Pico SDK (develop)
        uses: actions/checkout@v7
        with:
          repository: raspberrypi/pico-sdk
          ref: develop
          path: pico-sdk

      - name: Checkout Pico Examples (develop)
        uses: actions/checkout@v7
        with:
          repository: raspberrypi/pico-examples
          ref: develop
          path: pico-examples

      - name: Fetch required pico-sdk submodules
        # tinyusb: needed for pico_stdio_usb (hello_usb/serial/reset/anything).
        # mbedtls: needed for picotool itself - without it, CMake sets
        #   HAS_MBEDTLS=0 and the whole `seal` command (signing/hashing, used
        #   by test_seal_secure_boot.py, test_otp_secure_boot.py and the
        #   pre-existing test_seal_squash.py) is compiled out entirely, which
        #   fails those tests with "unknown command: seal".
        # Not the full recursive set (cyw43-driver/lwip/btstack), which is
        # much heavier and unused by anything this workflow builds.
        working-directory: pico-sdk
        run: git submodule update --init --depth 1 lib/tinyusb lib/mbedtls

      - name: Build picotool
        # Always install (never just build in-place): PICOTOOL_FLAT_INSTALL +
        # CMAKE_INSTALL_PREFIX is BUILDING.md's documented custom-path install
        # (see "Custom Path Installation"), and gives every downstream step -
        # the test suite, build_binaries.sh's picotool_DIR reuse, cleanup - one
        # consistent installed binary to point at instead of a raw build tree.
        # (~3 min in practice; bounded since there's no job-level timeout.)
        timeout-minutes: 10
        run: |
          cmake -S . -B build -G Ninja \
            -D PICO_SDK_PATH="${{ github.workspace }}/pico-sdk" \
            -D PICOTOOL_FLAT_INSTALL=1 \
            -D CMAKE_INSTALL_PREFIX="${{ github.workspace }}/install"
          cmake --build build
          cmake --install build

      - name: Build test firmware binaries
        working-directory: test
        # ~3 min in practice; bounded since there's no job-level timeout.
        timeout-minutes: 10
        env:
          PICO_SDK_PATH: ${{ github.workspace }}/pico-sdk
          PICO_EXAMPLES_PATH: ${{ github.workspace }}/pico-examples
        run: ./build_binaries.sh

      - name: Fetch MicroPython / CircuitPython firmware
        working-directory: test
        # Best-effort: test_bdev_firmware.py skips cleanly if these are absent,
        # so a flaky download here shouldn't fail the whole run. Timed out
        # rather than left to hang, since continue-on-error doesn't cover a
        # stalled download and there's no job-level timeout.
        continue-on-error: true
        timeout-minutes: 10
        run: ./fetch_firmware.sh

      - name: Set up Python test environment
        working-directory: test
        # Bounded so a hung pip / PyPI stall can't run to the 6-hour default.
        timeout-minutes: 10
        run: |
          python3 -m venv test-venv
          ./test-venv/bin/pip install --upgrade pip
          ./test-venv/bin/pip install -r requirements.txt

      - name: Run hardware test suite
        working-directory: test
        # Per-variant: the normal rp2040+rp2350 suite is ~15 min, but the FPGA
        # OTP/secure-boot suite is much slower (crypto verification is ~2-3 min
        # per signed boot), so it gets a larger budget (see select-suite).
        timeout-minutes: ${{ matrix.run_timeout }}
        env:
          # Passed via env rather than --picotool: a CLI option whose value
          # resolves to a real path outside test/ confuses pytest's rootdir/
          # conftest auto-detection (it gets treated as an extra collection
          # arg before conftest.py - and its --picotool addoption - has been
          # loaded), so "--picotool ../build/picotool" fails with
          # "unrecognized arguments: --picotool" even though --picotool is a
          # valid, registered option. conftest.py already falls back to this
          # env var, so just don't pass the flag at all.
          PICOTOOL: ${{ github.workspace }}/install/picotool/picotool
          # Only for the OTP/FPGA variant: TestSecureBootEnforcement's
          # one-way, whole-chip CRIT1.SECURE_BOOT_ENABLE fuse needs this
          # explicit second opt-in on top of --run-otp - see
          # test/README.md's "OTP tests" section. Left unset (rather than
          # "0") for the other variant, matching test_otp_secure_boot.py's
          # own `== "1"` check.
          PICOTOOL_TEST_ENABLE_SECURE_BOOT: ${{ matrix.run_otp_fpga && '1' || '' }}
        run: |
          ./test-venv/bin/python -m pytest -v --tb=short \
            ${{ matrix.pytest_args }} \
            --require-boards

      - name: Restore boards to a known-good app
        # Wired rig only. Always runs, even on failure/timeout above, so a test
        # that left a board on a partition table or in BOOTSEL doesn't affect
        # the next run. Deliberately NOT continue-on-error: this runner
        # misbehaves on its next reset if a board is left in BOOTSEL, so a board
        # still stuck after ci_restore_boards.py's own retries should fail the
        # job loudly rather than pass silently.
        # Skipped for the FPGA variant - see "Leave the FPGA in BOOTSEL" below.
        if: ${{ always() && !matrix.run_otp_fpga }}
        working-directory: test
        timeout-minutes: 5
        run: ./test-venv/bin/python ci_restore_boards.py ${{ github.workspace }}/install/picotool/picotool ${{ matrix.restore_boards_args }}

      - name: Leave the FPGA in BOOTSEL
        # FPGA/secure-boot variant: the secure-boot test permanently enables
        # secure boot, after which the chip only boots *signed* images - so
        # ci_restore_boards would fail trying to load an unsigned app. Just
        # leave the FPGA in BOOTSEL (the next run resets its OTP image anyway).
        if: ${{ always() && matrix.run_otp_fpga }}
        timeout-minutes: 2
        run: |
          PT="${{ github.workspace }}/install/picotool/picotool"
          if lsusb -d 2e8a:000f >/dev/null 2>&1; then
            echo "FPGA already in BOOTSEL"
          else
            echo "rebooting FPGA into BOOTSEL"
            "$PT" reboot -u -f || echo "::warning :: could not reboot the FPGA into BOOTSEL"
          fi
